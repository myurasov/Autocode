# Plugin tests (the spike checks first) against real OpenCode: the server, one
# OpenCode machine with the spike probe loaded beside the plugin, and the fake
# model.
services:
  fake-model:
    extends: { file: common.yml, service: fake-model }
  server:
    extends: { file: common.yml, service: server }
  node-a:
    extends: { file: common.yml, service: node }
    hostname: node-a
    environment:
      FAKE_MODEL_URL: http://fake-model:9000/node-a/v1
      PROBE: "1"
    depends_on:
      fake-model: { condition: service_healthy }
      server: { condition: service_healthy }
  runner:
    extends: { file: common.yml, service: runner }
    environment:
      NODES: node-a
      PROBE_URL: http://node-a:4097
    command: ["bun", "test", "--timeout", "600000", "tests/plugin"]
    depends_on:
      node-a: { condition: service_healthy }

volumes:
  server-data:
